<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>音のチェック・実験 — Pronunciation Lab</title><link rel="icon" href="icons/favicon-orange.png"><link rel="stylesheet" href="phoneme-lab.css?v=1"></head><body><main>
<header><a href="./">← 単語練習に戻る</a><span>EXPERIMENT</span></header><h1>文字ではなく、音をチェック。</h1><p class="intro">英語の発音とカタカナ読みを比べる、2単語の実験ページです。</p>
<div class="choices" role="group" aria-label="単語を選ぶ"><button data-word="sunglasses" aria-pressed="true">sunglasses</button><button data-word="millimeter" aria-pressed="false">millimeter</button></div>
<section class="card"><div class="input-pane"><div class="word"><h2 id="word">sunglasses</h2><span id="japanese">サングラス</span></div><p class="expected-label">目標の音（米音）</p><p id="expected" class="ipa" lang="en-fonipa"></p><p id="hint" class="hint"></p>
<button id="prepare" class="primary">音素チェックを準備する · 初回 約5MB</button><p id="status" role="status">音声はこの端末内で処理します。</p>
<div class="controls"><button id="record" class="primary" disabled>マイクで試す</button><svg viewBox="0 0 64 24" aria-label="マイク入力の波形"><path id="wave" d="M0 12 L64 12"/></svg></div>
<div class="samples"><button data-sample="en" disabled>英語のお手本で試す</button><button data-sample="ja" disabled>カタカナ読みの例で試す</button></div><p id="comparison" class="hint" hidden></p>
</div><div id="result" hidden aria-live="polite"><div class="result-top"><p>音の一致度 <small>参考値</small></p><strong id="similarity"></strong></div><p id="source"></p><p class="expected-label">モデルが聞き取った音</p><p id="heard" class="ipa" lang="en-fonipa"></p><div id="alignment" class="alignment" aria-label="目標と認識された音の比較"></div><audio id="playback" controls hidden></audio></div></section>
<p class="note">試作版です。音素の認識にも誤りがあり、英語のお手本でも満点にならない場合があります。カタカナ読みの確実な判別や、正式な発音評価はまだ保証できません。この参考値は通常練習・チャレンジの得点や履歴には保存しません。</p><footer>hama-js 1.7.0 · 音素を直接認識 · <a href="vendor/hama-1.7.0/NOTICE.txt">ライセンス</a></footer>
</main><script type="module" src="phoneme-lab.js?v=1"></script></body></html>

<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>iPadマイク確認 — Pronunciation Lab</title><link rel="icon" href="icons/favicon-orange.png"><link rel="stylesheet" href="style.css?v=21"><style>
body{max-width:880px;margin:0 auto;padding:24px;font-size:16px}h1{font-size:25px}p{line-height:1.8}.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.check-card{border:1px solid var(--line);border-radius:12px;background:white;padding:20px}.check-card button{width:100%;margin-top:12px}.check-word{font-size:36px;margin:12px 0}.check-result{min-height:30px;font-size:22px;overflow-wrap:anywhere}.check-status{min-height:32px;margin:14px 0;color:var(--green)}.check-tools{display:flex;gap:12px;margin:16px 0;flex-wrap:wrap}pre{white-space:pre-wrap;background:white;border:1px solid var(--line);padding:16px;font:12px/1.7 monospace;overflow-wrap:anywhere}a{color:var(--green)}@media(max-width:550px){.check-grid{grid-template-columns:1fr}body{padding:16px}}
</style></head><body><a href="./">← 練習画面へ</a><h1>iPadのマイクを2回確認</h1><p>①を押して「apple」と言い、終了したら②を押して「banana」と言ってください。お手本再生・得点・自動再接続を使わず、音声認識だけを確認します。</p><div class="check-grid"><section class="check-card"><h2>1回目</h2><p class="check-word" lang="en">apple</p><div id="result-1" class="check-result" aria-live="polite">—</div><button class="primary" id="check-1">① appleを言う</button></section><section class="check-card"><h2>2回目</h2><p class="check-word" lang="en">banana</p><div id="result-2" class="check-result" aria-live="polite">—</div><button class="primary" id="check-2">② bananaを言う</button></section></div><p class="check-status" id="check-status" role="status">マイクボタンを押すと開始します。</p><div class="check-tools"><button class="secondary" id="check-stop" disabled>認識を停止</button><button class="secondary" id="check-copy">診断記録をコピー</button></div><details open><summary>診断記録</summary><pre id="check-log">準備完了</pre></details><p>記録はこの画面だけに表示します。音声はブラウザの音声認識サービスで処理される場合があります。</p><script type="module" src="mic-check.js?v=1"></script></body></html>
